[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "descope-agent-auth"
version = "0.2.0"
description = "Client-side SDK for wiring a custom agent to Descope: acquire a Descope credential and exchange it for Connection/Resource tokens from the vault."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Descope" }]
keywords = ["descope", "agent", "auth", "oauth", "ciba", "outbound-apps"]
dependencies = [
    "httpx>=0.24,<1.0",
]

[project.optional-dependencies]
langgraph = ["langgraph>=0.2"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "mypy>=1.15",
    "ruff>=0.17",
]

[project.urls]
Homepage = "https://www.descope.com"
Documentation = "https://docs.descope.com/agentic-identity-hub"
Repository = "https://github.com/descope/descope-agent-auth"

[tool.hatch.build.targets.wheel]
packages = ["descope_agent_auth"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pinned explicitly so ruff upgrades don't silently widen the rule set.
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
# Optional extra (descope-agent-auth[langgraph]); not installed by `uv sync`.
module = ["langgraph.*"]
ignore_missing_imports = true

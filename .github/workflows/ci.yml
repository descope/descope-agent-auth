name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python:
    name: 🐍 Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    strategy:
      fail-fast: false
      matrix:
        version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check descope_agent_auth
      - name: Test (pytest)
        run: pytest -q

  typescript:
    name: 🟦 TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    strategy:
      fail-fast: false
      matrix:
        version: [18, 20, 22]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.version }}
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Format check
        run: npm run format-check
      - name: Lint
        run: npx eslint "src/**/*.ts"
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
